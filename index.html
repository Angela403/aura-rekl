<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aura by Angel — Когда пришла зарплата</title>

<style>
  @font-face {
    font-family: 'SnellRoundhand';
    src: local('Snell Roundhand'), local('SnellRoundhand'),
         url('fonts/snell-roundhand-3.woff2') format('woff2');
    font-weight: normal; font-style: normal; font-display: block;
  }
  @font-face {
    font-family: 'Gilroy';
    src: local('Gilroy-Light'), local('Gilroy Light'),
         local('Gilroy-UltraLight'), local('Gilroy UltraLight'),
         url('fonts/gilroy-light.woff2') format('woff2');
    font-weight: 300; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Gilroy';
    src: local('Gilroy-Regular'), local('Gilroy Regular'),
         local('Gilroy-Medium'), local('Gilroy Medium'),
         url('fonts/gilroy-light.woff2') format('woff2');
    font-weight: 500; font-style: normal; font-display: swap;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #1a0a0c;
    font-family: 'Gilroy', -apple-system, sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  #card {
    width: 1080px;
    height: 1920px;
    background: #310E12;
    color: #F5EDE0;
    position: relative;
    transform-origin: center center;
    box-shadow: none;
    display: flex;
    flex-direction: column;
    padding: 140px 110px;
    overflow: hidden;
  }

  .stage:not(.exporting) #card {
    box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
  }

  .card-frame {
    position: absolute;
    top: 56px; right: 56px; bottom: 56px; left: 56px;
    border: 2px solid rgba(245, 237, 224, 0.14);
    border-radius: 30px;
    pointer-events: none;
    box-sizing: border-box;
  }

  /* ─── Верх ─── */
  .top {
    text-align: center;
    padding-top: 60px;
    margin-bottom: 50px;
  }

  .brand {
    font-family: 'SnellRoundhand', cursive;
    font-size: 110px;
    line-height: 1;
    color: #F5EDE0;
    margin-bottom: 16px;
  }

  .tagline {
    font-family: 'Gilroy', sans-serif;
    font-size: 20px;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: #8A6068;
  }

  /* ─── Заголовок ─── */
  .question {
    font-family: 'Gilroy', sans-serif;
    font-weight: 500;
    font-size: 56px;
    text-align: center;
    line-height: 1.2;
    letter-spacing: 0.02em;
    color: #F5EDE0;
    margin-bottom: 70px;
  }

  /* ─── VS-блок ─── */
  .versus {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 40px;
    align-items: center;
    margin-bottom: 80px;
    padding: 0 20px;
  }

  .versus__side {
    text-align: center;
  }

  .versus__line1 {
    font-family: 'Gilroy', sans-serif;
    font-weight: 500;
    font-size: 36px;
    line-height: 1.2;
    letter-spacing: 0.02em;
    color: #F5EDE0;
    margin-bottom: 8px;
  }

  .versus__line2 {
    font-family: 'Gilroy', sans-serif;
    font-weight: 300;
    font-size: 30px;
    line-height: 1.2;
    letter-spacing: 0.02em;
    color: rgba(245, 237, 224, 0.82);
  }

  .versus__center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  .versus__vline {
    width: 2px;
    height: 60px;
    background: #8A6068;
    opacity: 0.7;
  }

  .versus__vs {
    font-family: 'SnellRoundhand', cursive;
    font-weight: normal;
    font-size: 84px;
    line-height: 0.9;
    color: #8A6068;
    margin: -6px 0;
  }

  /* ─── Иллюстрация — две руки ─── */
  .hands {
    flex-grow: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
    margin-bottom: 60px;
    position: relative;
  }

  .hand {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .hand svg {
    width: 100%;
    max-width: 340px;
    height: auto;
    overflow: visible;
  }

  .hand path, .hand rect, .hand circle {
    fill: #F5EDE0;
    stroke: none;
  }

  .hand .accent {
    fill: #8A6068;
  }

  /* ─── Логотип внизу ─── */
  .bottom {
    text-align: center;
    padding-bottom: 60px;
  }

  .bottom__brand {
    font-family: 'SnellRoundhand', cursive;
    font-size: 90px;
    line-height: 1;
    color: #F5EDE0;
    margin-bottom: 16px;
  }

  .bottom__sub {
    font-family: 'Gilroy', sans-serif;
    font-size: 20px;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: #8A6068;
  }

  /* ─── Раccыпанные декоры ─── */
  .sparkle {
    position: absolute;
    border-radius: 50%;
    background: #8A6068;
    opacity: 0.55;
  }
  .sparkle--light { background: #F5EDE0; opacity: 0.35; }
  .sparkle--tiny { width: 8px; height: 8px; }
  .sparkle--sm { width: 14px; height: 14px; }
  .sparkle--md { width: 20px; height: 20px; }
  .sparkle--lg { width: 28px; height: 28px; }

  /* ─── Кнопка ─── */
  .save-btn {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    background: #F5EDE0;
    color: #310E12;
    border: none;
    padding: 16px 40px;
    border-radius: 999px;
    font-family: 'Gilroy', sans-serif;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    transition: transform 0.2s, box-shadow 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .save-btn:hover { transform: translateX(-50%) translateY(-3px); box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5); }
  .save-btn:active { transform: translateX(-50%) translateY(0); }

  .hint {
    position: fixed;
    bottom: 92px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    font-family: 'Gilroy', sans-serif;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(245, 237, 224, 0.6);
    text-align: center;
    white-space: nowrap;
  }

  @media (max-width: 720px) {
    .hint { font-size: 10px; letter-spacing: 0.14em; }
    .save-btn { padding: 14px 32px; font-size: 13px; }
  }
</style>
</head>
<body>

<div class="stage">
  <div id="card">

    <div class="card-frame"></div>

    <!-- Раccыпанные декоративные элементы -->
    <div class="sparkle sparkle--sm"  style="top: 240px; left: 90px;"></div>
    <div class="sparkle sparkle--light sparkle--tiny" style="top: 300px; left: 180px;"></div>
    <div class="sparkle sparkle--md"  style="top: 380px; right: 120px;"></div>
    <div class="sparkle sparkle--light sparkle--sm"   style="top: 460px; right: 220px;"></div>
    <div class="sparkle sparkle--tiny" style="top: 620px; left: 130px;"></div>
    <div class="sparkle sparkle--lg"   style="top: 700px; right: 90px;"></div>
    <div class="sparkle sparkle--light sparkle--md" style="bottom: 620px; left: 100px;"></div>
    <div class="sparkle sparkle--sm"   style="bottom: 520px; right: 140px;"></div>
    <div class="sparkle sparkle--light sparkle--tiny" style="bottom: 400px; left: 200px;"></div>
    <div class="sparkle sparkle--md"   style="bottom: 340px; right: 220px;"></div>

    <!-- Верх -->
    <div class="top">
      <div class="brand">Aura by Angel</div>
      <div class="tagline">Украшения и аксессуары</div>
    </div>

    <!-- Заголовок -->
    <div class="question">Когда пришла зарплата:</div>

    <!-- VS-блок -->
    <div class="versus">
      <div class="versus__side">
        <div class="versus__line1">Начать</div>
        <div class="versus__line2">экономить</div>
      </div>
      <div class="versus__center">
        <div class="versus__vline"></div>
        <div class="versus__vs">vs</div>
        <div class="versus__vline"></div>
      </div>
      <div class="versus__side">
        <div class="versus__line1">Заказать</div>
        <div class="versus__line2">украшение</div>
      </div>
    </div>

    <!-- Две руки -->
    <div class="hands">

      <!-- Левая рука — указательный жест -->
      <div class="hand">
        <svg viewBox="0 0 340 400" xmlns="http://www.w3.org/2000/svg">
          <!-- Упрощённый силуэт руки с вытянутым указательным пальцем -->
          <path d="M 60 400
                   L 60 220
                   Q 60 180 80 160
                   L 130 120
                   Q 150 105 165 115
                   Q 175 122 170 138
                   L 165 165
                   L 220 130
                   Q 240 118 252 130
                   Q 260 140 252 152
                   L 215 200
                   L 265 175
                   Q 285 168 293 182
                   Q 297 194 285 202
                   L 235 245
                   L 275 230
                   Q 295 226 300 240
                   Q 302 252 288 258
                   L 230 290
                   Q 200 305 175 305
                   L 130 305
                   L 130 400 Z"
                fill="#F5EDE0"/>
          <!-- Браслет -->
          <rect x="55" y="255" width="80" height="14" rx="7" fill="#8A6068"/>
          <circle cx="95" cy="262" r="6" fill="#310E12"/>
          <!-- Кольцо на указательном -->
          <rect x="120" y="150" width="20" height="6" rx="3" fill="#8A6068"/>
        </svg>
      </div>

      <!-- Правая рука — кулак -->
      <div class="hand">
        <svg viewBox="0 0 340 400" xmlns="http://www.w3.org/2000/svg">
          <!-- Упрощённый силуэт кулака -->
          <path d="M 100 400
                   L 100 260
                   Q 100 220 120 200
                   L 140 185
                   Q 130 175 135 160
                   Q 140 148 155 150
                   L 180 155
                   Q 175 140 185 130
                   Q 198 122 210 132
                   L 225 148
                   Q 235 140 245 148
                   Q 252 158 246 170
                   L 235 185
                   Q 250 180 258 192
                   Q 262 204 252 214
                   L 235 228
                   Q 248 230 252 242
                   Q 254 254 242 260
                   L 200 275
                   L 200 400 Z"
                fill="#F5EDE0"/>
          <!-- Браслет -->
          <rect x="95" y="260" width="80" height="14" rx="7" fill="#8A6068"/>
          <circle cx="135" cy="267" r="8" fill="none" stroke="#310E12" stroke-width="2"/>
        </svg>
      </div>

    </div>

    <!-- Логотип внизу -->
    <div class="bottom">
      <div class="bottom__brand">Aura by Angel</div>
      <div class="bottom__sub">Украшения и аксессуары</div>
    </div>

  </div>
</div>

<div class="hint">Долгое нажатие на карточку — сохранить как изображение</div>
<button class="save-btn" id="saveBtn">Сохранить в галерею</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
  const card = document.getElementById('card');
  const stage = document.querySelector('.stage');
  const saveBtn = document.getElementById('saveBtn');

  function fitCard() {
    const stageW = stage.clientWidth;
    const stageH = stage.clientHeight;
    const scaleX = stageW / 1080;
    const scaleY = stageH / 1920;
    const scale = Math.min(scaleX, scaleY) * 0.94;
    card.style.transform = `scale(${scale})`;
  }

  fitCard();
  window.addEventListener('resize', fitCard);

  let exporting = false;

  async function exportToPng() {
    if (exporting) return;
    exporting = true;

    const originalTransform = card.style.transform;
    card.style.transform = 'scale(1)';
    stage.classList.add('exporting');

    try {
      const canvas = await html2canvas(card, {
        width: 1080,
        height: 1920,
        scale: 1,
        useCORS: true,
        backgroundColor: '#310E12',
        logging: false,
        windowWidth: 1080,
        windowHeight: 1920,
        scrollX: 0,
        scrollY: 0,
        allowTaint: false,
        removeContainer: true,
        x: 0,
        y: 0
      });

      const dataUrl = canvas.toDataURL('image/png');

      if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        const w = window.open('');
        if (w) {
          w.document.write(`<img src="${dataUrl}" style="width:100%;display:block" alt="Скидка 10%"/>`);
          w.document.title = 'Сохраните через долгое нажатие';
          w.document.body.style.margin = '0';
          w.document.body.style.background = '#1a0a0c';
        } else {
          downloadPng(dataUrl);
        }
      } else {
        downloadPng(dataUrl);
      }
    } catch (e) {
      console.error('Ошибка экспорта:', e);
      alert('Не удалось создать изображение. Попробуйте ещё раз.');
    } finally {
      card.style.transform = originalTransform;
      stage.classList.remove('exporting');
      exporting = false;
    }
  }

  function downloadPng(dataUrl) {
    const link = document.createElement('a');
    link.download = 'aura-angel-зарплата-1080x1920.png';
    link.href = dataUrl;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  saveBtn.addEventListener('click', exportToPng);

  let longPressTimer = null;

  function startLongPress() {
    longPressTimer = setTimeout(() => {
      exportToPng();
    }, 600);
  }

  function cancelLongPress() {
    if (longPressTimer) {
      clearTimeout(longPressTimer);
      longPressTimer = null;
    }
  }

  card.addEventListener('mousedown', startLongPress);
  card.addEventListener('touchstart', startLongPress, { passive: true });
  card.addEventListener('mouseup', cancelLongPress);
  card.addEventListener('mouseleave', cancelLongPress);
  card.addEventListener('touchend', cancelLongPress);
  card.addEventListener('touchcancel', cancelLongPress);
  card.addEventListener('touchmove', cancelLongPress);

  card.addEventListener('contextmenu', e => e.preventDefault());
</script>

</body>
</html>
