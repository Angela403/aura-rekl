<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aura by Angel — Когда пришла зарплата</title>

<style>
  @font-face {
    font-family: 'SnellRoundhand';
    src: local('Snell Roundhand'), local('SnellRoundhand'),
         url('fonts/snell-roundhand-3.woff2') format('woff2');
    font-weight: normal; font-style: normal; font-display: block;
  }
  @font-face {
    font-family: 'Gilroy';
    src: local('Gilroy-Light'), local('Gilroy Light'),
         local('Gilroy-UltraLight'), local('Gilroy UltraLight'),
         url('fonts/gilroy-light.woff2') format('woff2');
    font-weight: 300; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Gilroy';
    src: local('Gilroy-Regular'), local('Gilroy Regular'),
         local('Gilroy-Medium'), local('Gilroy Medium'),
         url('fonts/gilroy-light.woff2') format('woff2');
    font-weight: 500; font-style: normal; font-display: swap;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #1a0a0c;
    font-family: 'Gilroy', -apple-system, sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  #card {
    width: 1080px;
    height: 1920px;
    background: #310E12;
    color: #F5EDE0;
    position: relative;
    transform-origin: center center;
    box-shadow: none;
    display: flex;
    flex-direction: column;
    padding: 140px 100px;
    overflow: hidden;
  }

  .stage:not(.exporting) #card {
    box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
  }

  .card-frame {
    position: absolute;
    top: 56px; right: 56px; bottom: 56px; left: 56px;
    border: 2px solid rgba(245, 237, 224, 0.14);
    border-radius: 30px;
    pointer-events: none;
    box-sizing: border-box;
  }

  /* ─── Верх ─── */
  .top {
    text-align: center;
    padding-top: 60px;
    margin-bottom: 40px;
  }

  .brand {
    font-family: 'SnellRoundhand', cursive;
    font-size: 110px;
    line-height: 1;
    color: #F5EDE0;
    margin-bottom: 16px;
  }

  .tagline {
    font-family: 'Gilroy', sans-serif;
    font-size: 20px;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: #8A6068;
  }

  /* ─── Заголовок ─── */
  .question {
    font-family: 'Gilroy', sans-serif;
    font-weight: 500;
    font-size: 58px;
    text-align: center;
    line-height: 1.2;
    letter-spacing: 0.02em;
    color: #F5EDE0;
    margin-bottom: 60px;
  }

  /* ─── VS-блок с иконками рук ─── */
  .versus {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 30px;
    align-items: center;
    margin-bottom: 60px;
  }

  .versus__side {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }

  /* Иконка руки (лайн-арт) */
  .hand-icon {
    width: 200px;
    height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .hand-icon svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .hand-icon svg path,
  .hand-icon svg line,
  .hand-icon svg circle {
    fill: none;
    stroke: #F5EDE0;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .hand-icon svg .accent {
    stroke: #8A6068;
    fill: #8A6068;
  }

  .versus__label {
    font-family: 'Gilroy', sans-serif;
  }

  .versus__label-top {
    font-weight: 500;
    font-size: 34px;
    line-height: 1.15;
    letter-spacing: 0.02em;
    color: #F5EDE0;
    margin-bottom: 6px;
  }

  .versus__label-bottom {
    font-weight: 300;
    font-size: 28px;
    line-height: 1.15;
    letter-spacing: 0.02em;
    color: rgba(245, 237, 224, 0.78);
  }

  /* Центральная колонка VS */
  .versus__center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    padding: 0 10px;
  }

  .versus__vline {
    width: 2px;
    height: 60px;
    background: #8A6068;
    opacity: 0.7;
  }

  .versus__vs {
    font-family: 'SnellRoundhand', cursive;
    font-weight: normal;
    font-size: 96px;
    line-height: 0.85;
    color: #8A6068;
    margin: -4px 0;
  }

  /* ─── Подпись «кто победит» ─── */
  .punchline {
    text-align: center;
    font-family: 'Gilroy', sans-serif;
    font-weight: 300;
    font-size: 26px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #8A6068;
    margin-bottom: auto;
  }

  /* ─── Логотип внизу ─── */
  .bottom {
    text-align: center;
    padding-bottom: 60px;
    margin-top: 60px;
    border-top: 1px solid rgba(245, 237, 224, 0.16);
    padding-top: 50px;
  }

  .bottom__brand {
    font-family: 'SnellRoundhand', cursive;
    font-size: 88px;
    line-height: 1;
    color: #F5EDE0;
    margin-bottom: 16px;
  }

  .bottom__sub {
    font-family: 'Gilroy', sans-serif;
    font-size: 20px;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: #8A6068;
  }

  /* ─── Рассыпанные декоры ─── */
  .sparkle {
    position: absolute;
    border-radius: 50%;
    background: #8A6068;
    opacity: 0.5;
  }
  .sparkle--light { background: #F5EDE0; opacity: 0.3; }
  .sparkle--tiny { width: 7px; height: 7px; }
  .sparkle--sm { width: 12px; height: 12px; }
  .sparkle--md { width: 18px; height: 18px; }

  /* ─── Кнопка ─── */
  .save-btn {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    background: #F5EDE0;
    color: #310E12;
    border: none;
    padding: 16px 40px;
    border-radius: 999px;
    font-family: 'Gilroy', sans-serif;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    transition: transform 0.2s, box-shadow 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .save-btn:hover { transform: translateX(-50%) translateY(-3px); box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5); }
  .save-btn:active { transform: translateX(-50%) translateY(0); }

  .hint {
    position: fixed;
    bottom: 92px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    font-family: 'Gilroy', sans-serif;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(245, 237, 224, 0.6);
    text-align: center;
    white-space: nowrap;
  }

  @media (max-width: 720px) {
    .hint { font-size: 10px; letter-spacing: 0.14em; }
    .save-btn { padding: 14px 32px; font-size: 13px; }
  }
</style>
</head>
<body>

<div class="stage">
  <div id="card">

    <div class="card-frame"></div>

    <!-- Раccыпанные декоры -->
    <div class="sparkle sparkle--sm" style="top: 200px; left: 80px;"></div>
    <div class="sparkle sparkle--light sparkle--tiny" style="top: 280px; left: 200px;"></div>
    <div class="sparkle sparkle--md" style="top: 340px; right: 120px;"></div>
    <div class="sparkle sparkle--light sparkle--sm" style="top: 440px; right: 200px;"></div>
    <div class="sparkle sparkle--tiny" style="top: 900px; left: 100px;"></div>
    <div class="sparkle sparkle--md" style="top: 1000px; right: 90px;"></div>
    <div class="sparkle sparkle--light sparkle--md" style="bottom: 500px; left: 120px;"></div>
    <div class="sparkle sparkle--sm" style="bottom: 400px; right: 130px;"></div>
    <div class="sparkle sparkle--light sparkle--tiny" style="bottom: 300px; left: 220px;"></div>
    <div class="sparkle sparkle--md" style="bottom: 240px; right: 200px;"></div>

    <!-- Верх -->
    <div class="top">
      <div class="brand">Aura by Angel</div>
      <div class="tagline">Украшения и аксессуары</div>
    </div>

    <!-- Заголовок -->
    <div class="question">Когда пришла зарплата:</div>

    <!-- VS-блок с иконками -->
    <div class="versus">

      <!-- Левая — Ножницы -->
      <div class="versus__side">
        <div class="hand-icon">
          <svg viewBox="0 0 200 260">
            <!-- Основание ладони -->
            <path d="M 60 250 L 60 160 Q 60 135 80 125" />
            <path d="M 140 250 L 140 160 Q 140 135 120 125" />
            <path d="M 60 250 Q 100 260 140 250" />
            <!-- Указательный палец -->
            <path d="M 80 125 L 80 50 Q 80 30 90 30 Q 100 30 100 50 L 100 110" />
            <!-- Средний палец -->
            <path d="M 120 125 L 120 45 Q 120 25 130 25 Q 140 25 140 45 L 140 110" />
            <!-- Согнутые пальцы (намёк) -->
            <path d="M 80 165 Q 110 175 140 165" />
            <path d="M 80 195 Q 110 205 140 195" />
          </svg>
        </div>
        <div class="versus__label">
          <div class="versus__label-top">Начать</div>
          <div class="versus__label-bottom">экономить</div>
        </div>
      </div>

      <!-- По центру — VS -->
      <div class="versus__center">
        <div class="versus__vline"></div>
        <div class="versus__vs">vs</div>
        <div class="versus__vline"></div>
      </div>

      <!-- Правая — Камень (кулак) -->
      <div class="versus__side">
        <div class="hand-icon">
          <svg viewBox="0 0 200 260">
            <!-- Контур кулака -->
            <path d="M 55 250 L 55 145 Q 55 110 95 110 L 125 110 Q 150 110 150 135 L 150 250 Q 110 258 55 250 Z" />
            <!-- Линии пальцев — намёк на согнутые пальцы -->
            <path d="M 55 150 Q 100 145 150 150" />
            <path d="M 55 180 Q 100 175 150 180" />
            <path d="M 55 210 Q 100 205 150 210" />
            <!-- Большой палец -->
            <path d="M 90 118 Q 82 108 88 100 Q 98 92 110 105" />
          </svg>
        </div>
        <div class="versus__label">
          <div class="versus__label-top">Заказать</div>
          <div class="versus__label-bottom">украшение</div>
        </div>
      </div>

    </div>

    <!-- Панчлайн -->
    <div class="punchline">Камень побеждает. Заказывайте 🤍</div>

    <!-- Логотип внизу -->
    <div class="bottom">
      <div class="bottom__brand">Aura by Angel</div>
      <div class="bottom__sub">Украшения и аксессуары</div>
    </div>

  </div>
</div>

<div class="hint">Долгое нажатие на карточку — сохранить как изображение</div>
<button class="save-btn" id="saveBtn">Сохранить в галерею</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
  const card = document.getElementById('card');
  const stage = document.querySelector('.stage');
  const saveBtn = document.getElementById('saveBtn');

  function fitCard() {
    const stageW = stage.clientWidth;
    const stageH = stage.clientHeight;
    const scaleX = stageW / 1080;
    const scaleY = stageH / 1920;
    const scale = Math.min(scaleX, scaleY) * 0.94;
    card.style.transform = `scale(${scale})`;
  }

  fitCard();
  window.addEventListener('resize', fitCard);

  let exporting = false;

  async function exportToPng() {
    if (exporting) return;
    exporting = true;

    const originalTransform = card.style.transform;
    card.style.transform = 'scale(1)';
    stage.classList.add('exporting');

    try {
      const canvas = await html2canvas(card, {
        width: 1080,
        height: 1920,
        scale: 1,
        useCORS: true,
        backgroundColor: '#310E12',
        logging: false,
        windowWidth: 1080,
        windowHeight: 1920,
        scrollX: 0,
        scrollY: 0,
        allowTaint: false,
        removeContainer: true,
        x: 0,
        y: 0
      });

      const dataUrl = canvas.toDataURL('image/png');

      if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        const w = window.open('');
        if (w) {
          w.document.write(`<img src="${dataUrl}" style="width:100%;display:block" alt="Когда пришла зарплата"/>`);
          w.document.title = 'Сохраните через долгое нажатие';
          w.document.body.style.margin = '0';
          w.document.body.style.background = '#1a0a0c';
        } else {
          downloadPng(dataUrl);
        }
      } else {
        downloadPng(dataUrl);
      }
    } catch (e) {
      console.error('Ошибка экспорта:', e);
      alert('Не удалось создать изображение. Попробуйте ещё раз.');
    } finally {
      card.style.transform = originalTransform;
      stage.classList.remove('exporting');
      exporting = false;
    }
  }

  function downloadPng(dataUrl) {
    const link = document.createElement('a');
    link.download = 'aura-angel-зарплата-1080x1920.png';
    link.href = dataUrl;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  saveBtn.addEventListener('click', exportToPng);

  let longPressTimer = null;

  function startLongPress() {
    longPressTimer = setTimeout(() => {
      exportToPng();
    }, 600);
  }

  function cancelLongPress() {
    if (longPressTimer) {
      clearTimeout(longPressTimer);
      longPressTimer = null;
    }
  }

  card.addEventListener('mousedown', startLongPress);
  card.addEventListener('touchstart', startLongPress, { passive: true });
  card.addEventListener('mouseup', cancelLongPress);
  card.addEventListener('mouseleave', cancelLongPress);
  card.addEventListener('touchend', cancelLongPress);
  card.addEventListener('touchcancel', cancelLongPress);
  card.addEventListener('touchmove', cancelLongPress);

  card.addEventListener('contextmenu', e => e.preventDefault());
</script>

</body>
</html>
